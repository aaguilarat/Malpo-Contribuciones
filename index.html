<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Contribuciones - Malpo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #f8f7f5;
            color: #0b0b0b;
            padding: 2rem 1rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: #52514e;
            font-size: 14px;
            margin-bottom: 2rem;
        }
        
        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 2rem;
        }
        
        .kpi-card {
            background: white;
            border: 0.5px solid #e1e0d9;
            border-radius: 8px;
            padding: 20px;
        }
        
        .kpi-label {
            font-size: 12px;
            color: #52514e;
            margin-bottom: 8px;
        }
        
        .kpi-value {
            font-size: 24px;
            font-weight: 600;
        }
        
        .kpi-value.critical {
            color: #e34948;
        }
        
        .priority-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 2rem;
        }
        
        .priority-btn {
            text-align: center;
            padding: 1rem;
            border: 2px solid;
            border-radius: 8px;
            cursor: pointer;
            background: none;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .priority-btn:hover {
            transform: translateY(-2px);
        }
        
        .priority-btn p { margin: 0; }
        
        #btn-BAJA { background: rgba(12, 163, 12, 0.1); border-color: #0ca30c; }
        #btn-BAJA .amount { color: #0ca30c; font-weight: 600; font-size: 18px; }
        #btn-BAJA.selected { background: #0ca30c; }
        #btn-BAJA.selected .amount,
        #btn-BAJA.selected .label { color: white; }
        
        #btn-MEDIA { background: rgba(250, 178, 25, 0.1); border-color: #fab219; }
        #btn-MEDIA .amount { color: #fab219; font-weight: 600; font-size: 18px; }
        #btn-MEDIA.selected { background: #fab219; }
        #btn-MEDIA.selected .amount,
        #btn-MEDIA.selected .label { color: white; }
        
        #btn-ALTA { background: rgba(227, 73, 72, 0.1); border-color: #e34948; }
        #btn-ALTA .amount { color: #e34948; font-weight: 600; font-size: 18px; }
        #btn-ALTA.selected { background: #e34948; }
        #btn-ALTA.selected .amount,
        #btn-ALTA.selected .label { color: white; }
        
        #btn-URGENTE { background: rgba(11, 11, 11, 0.05); border-color: #0b0b0b; }
        #btn-URGENTE .amount { color: #0b0b0b; font-weight: 600; font-size: 18px; }
        #btn-URGENTE.selected { background: #0b0b0b; }
        #btn-URGENTE.selected .amount,
        #btn-URGENTE.selected .label { color: white; }
        
        #btn-NULA { background: #f0efec; border-color: #c3c2b7; }
        #btn-NULA .amount { color: #0b0b0b; font-weight: 600; font-size: 18px; }
        #btn-NULA.selected { background: white; border-color: #0b0b0b; }
        
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }
        
        input, select {
            padding: 8px 12px;
            border: 0.5px solid #e1e0d9;
            border-radius: 6px;
            font-size: 13px;
        }
        
        input { flex: 1; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: white;
        }
        
        th {
            text-align: left;
            padding: 12px;
            color: #52514e;
            font-weight: 500;
            font-size: 12px;
            border-bottom: 0.5px solid #e1e0d9;
            background: #fcfcfb;
            cursor: pointer;
            user-select: none;
        }
        
        th:hover {
            background: #f0efec;
        }
        
        th::after {
            content: ' ⇅';
            color: #c3c2b7;
            font-size: 10px;
            margin-left: 4px;
        }
        
        th.sort-asc::after {
            content: ' ↑';
            color: #0b0b0b;
        }
        
        th.sort-desc::after {
            content: ' ↓';
            color: #0b0b0b;
        }
        
        td {
            padding: 12px;
            border-bottom: 0.5px solid #e1e0d9;
        }
        
        td.text-right {
            text-align: right;
        }
        
        td.text-secondary {
            color: #52514e;
        }
        
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        
        .badge-baja { background: rgba(12, 163, 12, 0.2); color: #0ca30c; }
        .badge-media { background: rgba(250, 178, 25, 0.2); color: #fab219; }
        .badge-alta { background: rgba(227, 73, 72, 0.2); color: #e34948; }
        .badge-urgente { background: rgba(11, 11, 11, 0.15); color: #0b0b0b; }
        .badge-nula { background: #f0efec; color: #0b0b0b; }
        
        @media (max-width: 768px) {
            .priority-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .filters {
                flex-direction: column;
            }
            select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Control de Contribuciones</h1>
        <p class="subtitle">Deuda por ROL</p>
        
        <div class="kpis">
            <div class="kpi-card">
                <p class="kpi-label">Deuda Total</p>
                <p class="kpi-value" id="totalDebt">—</p>
            </div>
            <div class="kpi-card">
                <p class="kpi-label">Roles a pagar</p>
                <p class="kpi-value" id="totalRoles">—</p>
            </div>
            <div class="kpi-card">
                <p class="kpi-label">Seleccionado</p>
                <p class="kpi-value critical" id="selectedDebt">$0</p>
            </div>
            <div class="kpi-card">
                <p class="kpi-label">Última actualización</p>
                <p class="kpi-value" id="updateDate" style="font-size: 13px;">—</p>
            </div>
        </div>
        
        <div style="margin-bottom: 2rem;">
            <h2 style="font-size: 18px; margin-bottom: 1rem;">Deuda por prioridad (haz clic para seleccionar)</h2>
            <div class="priority-grid">
                <button id="btn-BAJA" class="priority-btn">
                    <p class="label">BAJA</p>
                    <div class="amount" id="debt-BAJA">—</div>
                </button>
                <button id="btn-MEDIA" class="priority-btn">
                    <p class="label">MEDIA</p>
                    <div class="amount" id="debt-MEDIA">—</div>
                </button>
                <button id="btn-ALTA" class="priority-btn">
                    <p class="label">ALTA</p>
                    <div class="amount" id="debt-ALTA">—</div>
                </button>
                <button id="btn-URGENTE" class="priority-btn">
                    <p class="label">URGENTE</p>
                    <div class="amount" id="debt-URGENTE">—</div>
                </button>
                <button id="btn-NULA" class="priority-btn">
                    <p class="label">NULA</p>
                    <div class="amount" id="debt-NULA">—</div>
                </button>
            </div>
        </div>
        
        <div class="filters">
            <input type="text" id="searchInput" placeholder="Buscar por ROL o proyecto...">
            <select id="priorityFilter">
                <option value="">Todas las prioridades</option>
                <option value="URGENTE">URGENTE</option>
                <option value="ALTA">ALTA</option>
                <option value="MEDIA">MEDIA</option>
                <option value="BAJA">BAJA</option>
                <option value="NULA">NULA</option>
            </select>
        </div>
        
        <div style="overflow-x: auto; margin-bottom: 2rem;">
            <table>
                <thead>
                    <tr>
                        <th data-column="ROL">ROL</th>
                        <th data-column="PROYECTO">Proyecto</th>
                        <th data-column="COMUNA">Comuna</th>
                        <th data-column="DEUDA VENCIDA" style="text-align: right;">Deuda Vencida</th>
                        <th data-column="DEUDA TOTAL" style="text-align: right;">Deuda Total</th>
                        <th data-column="ESTADO">Estado</th>
                        <th data-column="PRIORIDAD">Prioridad</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" style="text-align: center; color: #898781;">Cargando datos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

        let allData = DATA;
        let selectedPriorities = new Set();
        let sortColumn = null;
        let sortDirection = 'asc';
        
        function formatCurrency(num) {
            if (!num || isNaN(num)) return '$0';
            return '$' + Math.round(num).toLocaleString('es-CL');
        }
        
        function updateSelectedDebt() {
            let selected = 0;
            allData.forEach(row => {
                const priority = (row['PRIORIDAD'] || 'NULA').toUpperCase().trim();
                const debt = parseFloat(row['DEUDA TOTAL']) || 0;
                if (selectedPriorities.has(priority) && debt > 0) {
                    selected += debt;
                }
            });
            document.getElementById('selectedDebt').textContent = formatCurrency(selected);
        }
        
        function togglePriority(priority) {
            if (selectedPriorities.has(priority)) {
                selectedPriorities.delete(priority);
            } else {
                selectedPriorities.add(priority);
            }
            
            document.getElementById('btn-' + priority).classList.toggle('selected');
            updateSelectedDebt();
            renderTable();
        }
        
        function sortData(data) {
            if (!sortColumn) return data;
            
            return [...data].sort((a, b) => {
                let aVal = a[sortColumn] || '';
                let bVal = b[sortColumn] || '';
                
                const aNum = parseFloat(aVal);
                const bNum = parseFloat(bVal);
                
                if (!isNaN(aNum) && !isNaN(bNum)) {
                    return sortDirection === 'asc' ? aNum - bNum : bNum - aNum;
                }
                
                const aStr = String(aVal).toLowerCase();
                const bStr = String(bVal).toLowerCase();
                
                return sortDirection === 'asc' ? aStr.localeCompare(bStr) : bStr.localeCompare(aStr);
            });
        }
        
        function renderTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const priority = document.getElementById('priorityFilter').value;
            
            let filtered = allData.filter(row => {
                const debt = parseFloat(row['DEUDA TOTAL']) || 0;
                const matchSearch = !search || 
                    (row['ROL'] && row['ROL'].toLowerCase().includes(search)) ||
                    (row['PROYECTO'] && row['PROYECTO'].toLowerCase().includes(search));
                const matchPriority = !priority || (row['PRIORIDAD'] || '').toUpperCase().trim() === priority;
                
                let matchSelectedPriorities = true;
                if (selectedPriorities.size > 0) {
                    const rowPriority = (row['PRIORIDAD'] || 'NULA').toUpperCase().trim();
                    matchSelectedPriorities = selectedPriorities.has(rowPriority);
                }
                
                return matchSearch && matchPriority && matchSelectedPriorities && debt > 0;
            });
            
            filtered = sortData(filtered);
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #898781;">Sin resultados</td></tr>';
                return;
            }
            
            filtered.forEach(row => {
                const priority = (row['PRIORIDAD'] || 'NULA').toUpperCase().trim();
                const badgeClass = 'badge-' + priority.toLowerCase();
                
                const tr = document.createElement('tr');
                tr.innerHTML = `

                    <td class="text-secondary">${row['ESTADO'] || '—'}</td>
                    <td><span class="badge ${badgeClass}">${priority}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        function render() {
            let totalDebt = 0;
            let totalRoles = 0;
            const debt = {'URGENTE': 0, 'ALTA': 0, 'MEDIA': 0, 'BAJA': 0, 'NULA': 0};
            
            allData.forEach(row => {
                const d = parseFloat(row['DEUDA TOTAL']) || 0;
                if (d > 0) {
                    totalDebt += d;
                    totalRoles++;
                    const p = (row['PRIORIDAD'] || 'NULA').toUpperCase().trim();
                    if (debt.hasOwnProperty(p)) debt[p] += d;
                }
            });
            
            document.getElementById('totalDebt').textContent = formatCurrency(totalDebt);
            document.getElementById('totalRoles').textContent = totalRoles;
            Object.keys(debt).forEach(p => {
